<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Okuw Dersleriniň Tertibi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'timetable_grid' %}">
                <i class="bi bi-calendar3"></i> Okuw Dersleriniň Tertibi
            </a>
                        <style>
                            .navbar-btns {
                                display: flex;
                                gap: 12px;
                            }
                            .navbar-btn {
                                /* background: rgba(255,255,255,0.18); */
                                color: #fff !important;
                                border: none !important;
                                font-size: 1rem;
                                padding: 0.36rem 0.95rem;
                                border-radius: 7px;
                                display: flex;
                                align-items: center;
                                font-weight: 500;
                                transition: background 0.15s, color 0.15s;
                            }
                            .navbar-btn i { font-size: 1.08em; margin-right: 0.45em; }
                            .navbar-btn:hover, .navbar-btn:focus {
                                /* background: rgba(255,255,255,0.32); */
                                color: #e3e3e3 !important;
                                text-decoration: none;
                            }
                        </style>
                        <div class="navbar-btns">
                                <a href="{% url 'announcements-list' %}" class="navbar-btn">
                                        <i class="bi bi-bell"></i> Bildirişler
                                </a>
                                <a href="/admin/" class="navbar-btn">
                                        <i class="bi bi-person-circle"></i> Admin
                                </a>
                        </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
