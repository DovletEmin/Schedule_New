<!DOCTYPE html>
<html>
<head>
  <title>{{ announcement.title }}</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #pdf-js-viewer { width: 100vw; height: 100vh; border: none; }
  </style>
</head>
<body>
  <iframe
    id="pdf-js-viewer"
    src="https://mozilla.github.io/pdf.js/web/viewer.html?file={{ file_url }}"
    frameborder="0"
    width="100%"
    height="100%"
    allowfullscreen
  ></iframe>
</body>
</html>
